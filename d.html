<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ölçme Raporları</title>
    <style>
        :root {
            --main-font: "Times New Roman", Times, serif;
            --main-font-size: 14px;
            --main-text-color: #000000;
        }

        body {
            font-family: var(--main-font);
            color: var(--main-text-color);
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        /* --- KONTROL PANELİ --- */
        .toolbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 5px;
        }
        .toolbar label { font-size: 13px; font-weight: bold; }
        .toolbar select, .toolbar input[type="number"], .toolbar input[type="file"] {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .toolbar button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .toolbar button:hover { background-color: #d35400; }
        .btn-green { background-color: #27ae60 !important; }
        .btn-green:hover { background-color: #2ecc71 !important; }
        .btn-blue { background-color: #2980b9 !important; }
        .btn-blue:hover { background-color: #1f618d !important; }
        .btn-red { background-color: #c0392b !important; }
        .btn-red:hover { background-color: #e74c3c !important; }
        .btn-purple { background-color: #8e44ad !important; }
        .btn-purple:hover { background-color: #9b59b6 !important; }

        /* --- A4 TASARIMI --- */
        .container {
            background-color: white;
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 40px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
        }

        /* --- TABLO TASARIMI (ZEBRA) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border: 2px solid #E88316;
            font-size: var(--main-font-size);
            table-layout: fixed; /* Sütunların esnemesini dengeler */
        }
        
        th, td {
            border: 2px solid #E88316;
            padding: 12px;
            text-align: left;
            vertical-align: top;
            line-height: 1.4;
        }

        th {
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            background-color: #FCE5CD;
            color: var(--main-text-color);
        }

        tbody tr:nth-child(even) td { background-color: #F9F1EB; }
        tbody tr:nth-child(odd) td { background-color: #ffffff; }
        tbody td:first-child { font-weight: bold; text-align: center; vertical-align: middle; }
        tfoot td { font-weight: bold; background-color: #F9F1EB; font-size: 15px;}

        /* Puanlama Hücreleri */
        tbody td:last-child {
            text-align: center;
            vertical-align: middle;
            font-size: 18px;
            font-weight: bold;
            color: #c0392b;
            background-color: #fdf5e6;
            width: 10%;
        }
        #toplam-puan { font-size: 20px; color: #c0392b; text-align: center; }

        .feedback {
            font-size: var(--main-font-size);
            font-weight: bold;
            margin-top: 15px;
            min-height: 50px;
            border: 1px dashed #ccc;
            padding: 10px;
        }

        [contenteditable="true"] { outline: none; transition: background 0.2s; }
        [contenteditable="true"]:hover { background-color: rgba(232, 131, 22, 0.1); cursor: text; }
        [contenteditable="true"]:focus { background-color: rgba(232, 131, 22, 0.2); }

        /* --- YAZDIRMA (TEK SAYFAYA SIĞDIRMA) AYARLARI --- */
        @media print {
            .toolbar { display: none !important; }
            html, body { background-color: white; margin: 0; padding: 0; height: 100%; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; height: 100vh; display: flex; flex-direction: column; }
            .feedback { border: none; }
            table { flex-grow: 1; margin-bottom: 10px; }
            th, td { padding: 6px 8px !important; font-size: 13px !important; }
            tr { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4 landscape; margin: 10mm; }
        }
    </style>
</head>

        <button onclick="sablonYukle()">Doldur</button>
    </div>

    <div class="toolbar-group">
        <label>Yönetim:</label>

        <button class="btn-blue" onclick="document.getElementById('jsonYukleyici').click()" title="Dosyadan Yükle">⬆️ Yükle</button>
    </div>

    <div style="margin-left: auto; display: flex; gap: 5px;">
        <button class="btn-red" onclick="hafizayiTemizle()">🗑️ Temizle</button>
        <button onclick="satirEkle()">+ Satır</button>

    function updateStyles() {
        const font = document.getElementById('fontSelector').value;
        const size = document.getElementById('fontSizeSelector').value + 'px';
        document.documentElement.style.setProperty('--main-font', font);
        document.documentElement.style.setProperty('--main-font-size', size);
        veriKaydet();
    }

    function satirEkle() {
        const govde = document.getElementById('rubrik-govdesi');
        const yeniSatir = document.createElement('tr');
        
        // Mevcut sütun sayısına göre (GuncelKriterSayisi) dinamik satır ekle
        let htmlContent = '<td contenteditable="true">Yeni Ölçüt</td>';
        for(let i=0; i<guncelKriterSayisi; i++) {
            htmlContent += '<td contenteditable="true"></td>';
        }
        htmlContent += '<td contenteditable="true" class="puan-hucresi"></td>';
        
        yeniSatir.innerHTML = htmlContent;
        govde.appendChild(yeniSatir);
        veriKaydet();
    }

    function sablonKaydetBrowser() {
        const isim = prompt("Kaydedilecek şablon için bir isim giriniz:");
        if (!isim) return;

        const satirlar = [];
        document.querySelectorAll('#rubrik-govdesi tr').forEach(tr => {
            const hucreler = [];
            tr.querySelectorAll('td:not(.puan-hucresi)').forEach(td => hucreler.push(td.innerText));
            satirlar.push(hucreler);
        });

        // Dinamik başlıkları al
        const kriterler = [];
        const theadCells = document.querySelectorAll('#kriterler-satiri th');
        for(let i=1; i < theadCells.length - 1; i++) {
            kriterler.push(theadCells[i].innerHTML);
        }

        const yeniSablon = {
            isim: isim,
            veri: {
                baslik: document.getElementById('ana-baslik').innerText,
                kriterler: kriterler,
                satirlar: satirlar
            }
        };

        let kayitliSablonlar = JSON.parse(localStorage.getItem('ogretmenAsistanOzelSablonlar')) || {};
        const sablonId = 'ozel_' + Date.now();
        kayitliSablonlar[sablonId] = yeniSablon;
        localStorage.setItem('ogretmenAsistanOzelSablonlar', JSON.stringify(kayitliSablonlar));

        kayitliSablonlariMenuyeEkle();
        alert("Şablon '" + isim + "' adıyla başarıyla kaydedildi!");
    }

    function kayitliSablonlariMenuyeEkle() {
        const grup = document.getElementById('ozel-sablonlar-grubu');
        grup.innerHTML = '';
        let kayitliSablonlar = JSON.parse(localStorage.getItem('ogretmenAsistanOzelSablonlar')) || {};
        
        let varMi = false;
        for (const [id, sablon] of Object.entries(kayitliSablonlar)) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.innerText = "⭐ " + sablon.isim;
            grup.appendChild(opt);
            varMi = true;
        }
        
        if (!varMi) {
            const opt = document.createElement('option');
            opt.disabled = true;
            opt.innerText = "(Henüz kaydedilmiş şablon yok)";
            grup.appendChild(opt);
        }
    }

    function sablonYukle() {
        try {
            const secim = document.getElementById('sablonSecici').value;
            if (!secim) {
                alert("⚠️ Lütfen menüden bir şablon seçiniz.");
                return;
            }

            let veri;
            if (secim.startsWith('ozel_')) {
                let kayitliSablonlar = JSON.parse(localStorage.getItem('ogretmenAsistanOzelSablonlar')) || {};
                veri = kayitliSablonlar[secim].veri;
            } else {
                veri = sablonVerileri[secim];
            }
            tabloyuOlustur(veri.baslik, veri.kriterler, veri.satirlar);
        } catch (error) {
            console.error(error);
        }
    }

    // GÜNCELLENMİŞ DİNAMİK TABLO OLUŞTURMA FONKSİYONU
    function tabloyuOlustur(baslik, kriterler, satirlar) {
        const theadTr = document.getElementById('kriterler-satiri');
        const govde = document.getElementById('rubrik-govdesi');
        const footTr = document.getElementById('foot-satiri');
        
        guncelKriterSayisi = kriterler.length;

        // Başlık ve Genişlik Ayarları
        document.getElementById('ana-baslik').innerText = baslik;
        document.getElementById('ana-baslik').colSpan = guncelKriterSayisi + 2; 

        // Sütun başlıklarını dinamik olarak oluştur
        theadTr.innerHTML = '<th contenteditable="true" style="width: 20%;">Ölçütler</th>';
        kriterler.forEach(k => {
            theadTr.innerHTML += `<th contenteditable="true">${k}</th>`;
        });
        theadTr.innerHTML += '<th contenteditable="true" style="width: 10%;">Başarı Puanı</th>';

        // Alt Toplam alanını dinamik birleştir
        footTr.innerHTML = `<td contenteditable="true" style="text-align: right;" colspan="${guncelKriterSayisi + 1}">TOPLAM PUAN:</td><td id="toplam-puan">0</td>`;

        // Satırları doldur
        govde.innerHTML = ""; 
        satirlar.forEach(satirVerisi => {
            const tr = document.createElement('tr');
            
            // İlk hücre (Ölçüt Adı)
            const tdOlcut = document.createElement('td');
            tdOlcut.contentEditable = "true";
            tdOlcut.innerHTML = satirVerisi[0];
            tr.appendChild(tdOlcut);

            // Dinamik kriter hücreleri
            for(let i=0; i<guncelKriterSayisi; i++) {
                const td = document.createElement('td');
                td.contentEditable = "true";
                td.innerHTML = satirVerisi[i+1] || "";
                tr.appendChild(td);
            }

            // Puan hücresi
            const tdPuan = document.createElement('td');
            tdPuan.contentEditable = "true";
            tdPuan.className = "puan-hucresi";
            tr.appendChild(tdPuan);
            govde.appendChild(tr);
        });
        
        hesapla();
        veriKaydet();
    }

    document.getElementById('yazdirma-alani').addEventListener('input', function(e) {
        veriKaydet();
        if(e.target && e.target.classList.contains('puan-hucresi')) {
            hesapla();
        }
    });

    function hesapla() {
        let toplam = 0;
        const puanHucreleri = document.querySelectorAll('.puan-hucresi');
        puanHucreleri.forEach(hucre => {
            const puan = parseInt(hucre.innerText.trim());
            if (!isNaN(puan)) {
                toplam += puan;
            }
        });
        
        const toplamPuanHucresi = document.getElementById('toplam-puan');
        if(toplamPuanHucresi) {
            toplamPuanHucresi.innerText = toplam;
        }
        veriKaydet();
    }

    function sablonIndir() {
        const satirlar = [];
        document.querySelectorAll('#rubrik-govdesi tr').forEach(tr => {
            const hucreler = [];
            tr.querySelectorAll('td:not(.puan-hucresi)').forEach(td => hucreler.push(td.innerText));
            satirlar.push(hucreler);
        });

        const kriterler = [];
        const theadCells = document.querySelectorAll('#kriterler-satiri th');
        for(let i=1; i < theadCells.length - 1; i++) {
            kriterler.push(theadCells[i].innerHTML);
        }

        const ozelSablon = {
            baslik: document.getElementById('ana-baslik').innerText,
            kriterler: kriterler,
            satirlar: satirlar
        };

        const blob = new Blob([JSON.stringify(ozelSablon, null, 2)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Ozel_Rubrik_Sablonu.json";
        a.click();
    }

    function sablonDisaridanYukle(event) {
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const veri = JSON.parse(e.target.result);
                tabloyuOlustur(veri.baslik, veri.kriterler, veri.satirlar);
                alert("Şablon başarıyla yüklendi!");
            } catch (err) {
                alert("Geçersiz şablon dosyası.");
            }
        };
        reader.readAsText(file);
    }

    function veriKaydet() {
        const htmlIcerik = document.getElementById('yazdirma-alani').innerHTML;
        localStorage.setItem('ogretmenAsistanHafizaSade', htmlIcerik);
        localStorage.setItem('ogretmenAsistanKriterSayisi', guncelKriterSayisi);
    }

    function hafizayiTemizle() {
        if(confirm("Tüm veriler temizlenecek, emin misiniz?")) {
            localStorage.removeItem('ogretmenAsistanHafizaSade');
            localStorage.removeItem('ogretmenAsistanKriterSayisi');
            location.reload();
        }
    }

    window.onload = function() {
        kayitliSablonlariMenuyeEkle();
        const kayitliVeri = localStorage.getItem('ogretmenAsistanHafizaSade');
        const kayitliSayi = localStorage.getItem('ogretmenAsistanKriterSayisi');
        
        if(kayitliVeri && kayitliSayi) {
            guncelKriterSayisi = parseInt(kayitliSayi);
            document.getElementById('yazdirma-alani').innerHTML = kayitliVeri;
            hesapla();
        }
    }

</script>

</body>
</html>
